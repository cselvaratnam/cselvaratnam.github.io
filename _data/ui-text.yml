# Interface strings for Minimal Mistakes (the "Follow:" label, "Back to
# top", and so on).
#
# WHY THIS FILE EXISTS: Jekyll themes only supply _layouts, _includes,
# _sass and assets -- never _data. So the theme's own copy of this file is
# NOT loaded, and any string the theme prints without a fallback comes out
# blank. Deleting this file silently removes the "Follow:" label.
#
# Copied from minimal-mistakes 4.28.0 and expanded (the upstream file uses
# a YAML merge key, which is best avoided here). Must match site.locale in
# _config.yml -- currently en-GB. Reword any string freely.
en-GB:
  skip_links                 : "Skip links"
  skip_primary_nav           : "Skip to primary navigation"
  skip_content               : "Skip to content"
  skip_footer                : "Skip to footer"
  page                       : "Page"
  pagination_previous        : "Previous"
  pagination_next            : "Next"
  breadcrumb_home_label      : "Home"
  breadcrumb_separator       : "/"
  menu_label                 : "Toggle menu"
  search_label               : "Toggle search"
  toc_label                  : "On this page"
  ext_link_label             : "Direct link"
  less_than                  : "less than"
  minute_read                : "minute read"
  share_on_label             : "Share on"
  meta_label                 :
  tags_label                 : "Tags:"
  categories_label           : "Categories:"
  date_label                 : "Updated:"
  comments_label             : "Leave a comment"
  comments_title             : "Comments"
  more_label                 : "Learn more"
  related_label              : "You may also enjoy"
  # follow_label deliberately omitted. The theme renders the footer label only
  # if this key has a value, so leaving it out drops the "Follow:" text and its
  # <strong> entirely. Setting it to "" would NOT work -- an empty string is
  # truthy in Liquid, so you would get an empty bold tag instead.
  feed_label                 : "Feed"
  # Prepends the Claude Code credit to the theme's own line, which then
  # supplies "Jekyll & Minimal Mistakes" itself. The theme prints this
  # string unescaped, so the link works. Doing it here means footer.html
  # does not need overriding at all.
  powered_by                 : "Managed by <a href=\"https://claude.com/product/claude-code\" rel=\"nofollow\">Claude Code</a>, powered by"
  website_label              : "Website"
  email_label                : "Email"
  recent_posts               : "Recent posts"
  undefined_wpm              : "Undefined parameter words_per_minute at _config.yml"
  comment_form_info          : "Your email address will not be published. Required fields are marked"
  comment_form_comment_label : "Comment"
  comment_form_md_info       : "Markdown is supported."
  comment_form_name_label    : "Name"
  comment_form_email_label   : "Email address"
  comment_form_website_label : "Website (optional)"
  comment_btn_submit         : "Submit comment"
  comment_btn_submitted      : "Submitted"
  comment_success_msg        : "Thanks for your comment! It will show on the site once it has been approved."
  comment_error_msg          : "Sorry, there was an error with your submission. Please make sure all required fields have been completed and try again."
  loading_label              : "Loading..."
  search_label_text          : "Enter your search term..."
  search_placeholder_text    : "Enter your search term..."
  search_algolia_no_results  : "No results"
  results_found              : "Result(s) found"
  back_to_top                : "Back to top"
